# /etc/nginx/sites-available/kslife-pptx-api 로 설치.
# server_name을 실제 DuckDNS 도메인(예: kslife-pptx.duckdns.org)으로 바꾼 뒤:
#   sudo ln -s /etc/nginx/sites-available/kslife-pptx-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kslife-pptx.duckdns.org   # 443/redirect는 certbot이 자동으로 추가
server {
    listen 80;
    server_name kslife-pptx.duckdns.org;

    location /api/fill-ppt {
        proxy_pass http://127.0.0.1:8123/api/fill-ppt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:8123/api/health;
        proxy_set_header Host $host;
    }
}
